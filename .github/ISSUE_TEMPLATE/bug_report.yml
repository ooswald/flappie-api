name: Bug report
description: Something doesn't work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what actually happened.
      placeholder: |
        1. Ran `flappie ...`
        2. Expected: ...
        3. Got: ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output / error
      description: Paste the full error message and any stack trace.
      render: text

  - type: input
    id: package-version
    attributes:
      label: flappie-api version
      description: "Run `flappie --version` or check your `package.json`."
      placeholder: "0.4.0"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: "Run `node --version`."
      placeholder: "v22.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15 / Ubuntu 24.04 / Windows 11"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: |
        Did the Flappie mobile app ship an update around the same time?
        Endpoint behaviour can drift — see RE.md for how to re-run the
        reverse-engineering flow.
