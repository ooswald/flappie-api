name: Feature request
description: Suggest a new endpoint, CLI command, or library improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to add or change?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why? What's the use case?
      description: A concrete scenario helps a lot - "I want to wire this into Home Assistant and need X".
    validations:
      required: true

  - type: textarea
    id: api-context
    attributes:
      label: Is this already in the API surface?
      description: |
        Check `CLOUD_API.md` - endpoints we know about but haven't wrapped yet are
        marked 🟡. If yours is one of them, link to that row. If it's a new
        endpoint we'd have to discover, mention that too.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
